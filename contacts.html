<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Headquarters | Contacts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script src="js/contacts.js" defer></script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 mb-4 pb-3 border-bottom border-secondary-subtle">
                        <div class="d-flex align-items-center gap-3">
                            <div class="app-icon-wrapper-sm">
                                <i class="bi bi-person-lines-fill"></i>
                            </div>
                            <div>
                                <p class="text-uppercase small text-secondary-contrast mb-1 letter-spacing">Directory</p>
                                <h1 id="title" class="h3 fw-bold mb-0">Contacts Headquarters</h1>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-2">
                            <span class="badge rounded-pill bg-primary-subtle text-primary-emphasis px-3 py-2">
                                <i class="bi bi-shield-check me-1"></i> User Secure
                            </span>
                            <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="window.location.href='index.html'">
                                <i class="bi bi-box-arrow-right me-1"></i> Log Out
                            </button>
                        </div>
                    </div>

                    <div class="section-card p-4 rounded-4 border mb-4">
                        <label for="searchInput" class="form-label form-label-contrast small text-uppercase">Search Contacts</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                            <input id="searchText" type="text" class="form-control" placeholder="Search by name, email, or phone" />
                            <button id="searchButton" type="button" class="btn btn-primary px-4 fw-semibold" onclick="searchContacts()">Search</button>
                        </div>
                    </div>

                    <div class="section-card p-4 rounded-4 border">
                        <h2 class="h5 fw-bold mb-4 text-white">
                            <i class="bi bi-person-plus-fill me-2 text-primary"></i>Add New Contact
                        </h2>

                        <form id="contactForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label form-label-contrast small text-uppercase">First Name</label>
                                    <input id="firstName" type="text" class="form-control" placeholder="John" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label form-label-contrast small text-uppercase">Last Name</label>
                                    <input id="lastName" type="text" class="form-control" placeholder="Doe" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label form-label-contrast small text-uppercase">Phone Number</label>
                                    <input id="phone" type="tel" class="form-control" placeholder="(407) 555-0147" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label form-label-contrast small text-uppercase">Email Address</label>
                                    <input id="email" type="email" class="form-control" placeholder="john.doe@example.com" required>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
                                <button type="button" class="btn btn-primary w-100 py-3 fw-semibold" onclick="addContact()">
                                    <i class="bi bi-plus-circle me-1"></i> Add Contact
                                </button>
                                <button type="button" id="clearForm" class="btn btn-outline-secondary px-4 fw-semibold">
                                    Clear
                                </button>
                            </div>
                        </form>

                        <div id="contactStatus" class="mt-3 small fw-semibold"></div>
                    </div>

                    <div class="mt-4">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h2 class="h5 fw-bold text-white mb-0">
                                <i class="bi bi-people-fill me-2 text-primary"></i>Contact List
                            </h2>
                            <span id="contactCount" class="badge text-bg-dark rounded-pill px-3 py-2">0</span>
                        </div>
                        <div id="contactList" class="d-grid gap-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
