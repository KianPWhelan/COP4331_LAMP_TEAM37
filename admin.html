<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Headquarters | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="css/styles.css" rel="stylesheet">
    <script src="js/admin.js"></script>
</head>

<body class="py-5">
    <div class="background-glow"></div>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9">

                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <h1 class="fw-bold">
                        Admin Dashboard
                    </h1>

                    <p class="text-secondary-contrast small">
                        Manage application users
                    </p>
                </div>

                <div class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="h5 mb-0">
                                Users
                            </h2>

                            <div class="d-flex align-items-center gap-2">
                                <button class="btn btn-outline-light btn-sm" onclick="loadUsers()">
                                    Refresh
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="window.location.href='index.html'">
                                    <i class="bi bi-box-arrow-right me-1"></i> Log Out
                                </button>
                            </div>
                        </div>

                        <div id="adminResult" class="mb-3 small"></div>

                        <div class="table-responsive">
                            <table class="table table-dark table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Login</th>
                                        <th>Role</th>
                                        <th class="text-end">Action</th>
                                    </tr>
                                </thead>

                                <tbody id="userList"></tbody>
                            </table>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
