<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts Headquarters | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="css/styles.css" rel="stylesheet">
    <script src="js/admin.js" defer></script>
</head>

<body class="py-5">
    <div class="background-glow"></div>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12">

                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>

                    <h1 class="fw-bold">
                        Admin Dashboard
                    </h1>

                    <p class="text-secondary-contrast small">
                        Manage application users
                    </p>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                    <div>
                        <h2 class="h4 mb-1">User directory</h2>
                        <p class="text-secondary-contrast small mb-0">Search accounts, manage access, or inspect their contacts.</p>
                    </div>
                    <button type="button" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="window.location.href='index.html'">
                        <i class="bi bi-box-arrow-right me-1"></i> Log Out
                    </button>
                </div>

                <div id="adminResult" class="mb-3 small" role="status" aria-live="polite"></div>

                <section class="card glass-card shadow-lg border-0 p-4 p-sm-5 mb-4" aria-labelledby="usersHeading">
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
                        <h2 id="usersHeading" class="h5 mb-0">Users</h2>
                        <div class="d-flex gap-2">
                            <input id="userSearch" class="form-control" type="search" placeholder="Search users" aria-label="Search users">
                            <button type="button" class="btn btn-primary" onclick="loadUsers()">Search</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                                <tr><th>ID</th><th>Name</th><th>Login</th><th>Role</th><th>Status</th><th class="text-end">Actions</th></tr>
                            </thead>
                            <tbody id="userList"></tbody>
                        </table>
                    </div>
                </section>

                <section id="userContactsSection" class="card glass-card shadow-lg border-0 p-4 p-sm-5 mb-4" aria-labelledby="userContactsHeading" hidden>
                    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
                        <div>
                            <h2 id="userContactsHeading" class="h5 mb-1">User contacts</h2>
                            <p id="selectedUserLabel" class="text-secondary-contrast small mb-0"></p>
                        </div>
                        <div class="d-flex gap-2">
                            <input id="contactSearch" class="form-control" type="search" placeholder="Search these contacts" aria-label="Search selected user's contacts">
                            <button type="button" class="btn btn-primary" onclick="loadSelectedUserContacts()">Search</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
                            <tbody id="adminContactList"></tbody>
                        </table>
                    </div>
                </section>

                <section class="card glass-card shadow-lg border-0 p-4 p-sm-5" aria-labelledby="createAdminHeading">
                    <h2 id="createAdminHeading" class="h5 mb-3">Create administrator</h2>
                    <form id="createAdminForm" class="row g-3">
                        <div class="col-md-3"><label class="form-label" for="adminFirstName">First name</label><input class="form-control" id="adminFirstName" required maxlength="50"></div>
                        <div class="col-md-3"><label class="form-label" for="adminLastName">Last name</label><input class="form-control" id="adminLastName" required maxlength="50"></div>
                        <div class="col-md-3"><label class="form-label" for="adminLogin">Login</label><input class="form-control" id="adminLogin" required maxlength="50"></div>
                        <div class="col-md-3"><label class="form-label" for="adminPassword">Password</label><input class="form-control" id="adminPassword" type="password" required minlength="8" autocomplete="new-password"></div>
                        <div class="col-12"><button class="btn btn-success" type="submit"><i class="bi bi-person-plus me-1"></i>Create Admin</button></div>
                    </form>
                </section>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
